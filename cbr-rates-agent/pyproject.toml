[project]
name = "cbr-rates-agent"
version = "0.1.0"
description = "AI agent for Central Bank of Russia rates via MCP, with LangGraph, FastAPI and Redis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "cbr-rates-agent" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "httpx>=0.27.0",
    "langchain>=0.3.13",
    "langchain-core>=0.3.34",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.13",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph>=0.2.60",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "basedpyright>=1.13.0",
]

[project.scripts]
cbr-agent = "cbr_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cbr_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ASYNC", # flake8-async
    "RUF", # Ruff-specific
]
ignore = [
    "E501",   # line length (handled by formatter)
    "RUF001", # ambiguous Cyrillic/Latin chars in strings (false positives в русском тексте)
    "RUF002", # ambiguous Cyrillic/Latin chars in docstrings
    "RUF003", # ambiguous Cyrillic/Latin chars in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "N803"]

[tool.basedpyright]
pythonVersion = "3.11"
include = ["src/cbr_agent"]
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeArgument = "none"
reportMissingParameterType = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
